<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>账号库存编辑器 · 龙息配装器</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="inventory.css">
</head>
<body>
  <header class="app-header">
    <div class="brand">账号库存</div>
    <div class="data-status" id="data-status">正在载入公共数据…</div>
    <div class="header-actions">
      <a class="button button-secondary" href="index.html">配装计算</a>
      <a class="button button-secondary" href="staging-review.html">字段校对</a>
      <label class="button button-secondary" for="account-file">导入 JSON</label>
      <input id="account-file" type="file" accept="application/json,.json" hidden>
      <button class="button button-secondary" id="load-example" type="button">载入示例</button>
    </div>
  </header>

  <main class="inventory-workspace">
    <aside class="inventory-sidebar">
      <p class="eyebrow">ACCOUNT SNAPSHOT</p>
      <h1>本地账号文件</h1>
      <p class="sidebar-copy">这是自动采集器的人工保底入口，也是未来 OCR 输出的校验基准。所有数据只保存在当前浏览器内存，导出后才会写入文件。</p>
      <div class="inventory-counts" id="inventory-counts"></div>
      <div class="sidebar-actions">
        <label class="field import-mode-field"><span>导入方式</span><select id="import-mode"><option value="replace">替换当前账号</option><option value="merge">按稳定 ID 合并</option></select></label>
        <button class="button button-secondary" id="new-account" type="button">新建空账号</button>
        <button class="button button-secondary" id="export-account" type="button">导出账号 JSON</button>
        <button class="button button-primary" id="use-in-optimizer" type="button">用此账号计算</button>
      </div>
      <div class="diff-summary" id="diff-summary" hidden></div>
      <div class="account-summary" id="snapshot-meta"></div>
    </aside>

    <section class="inventory-main">
      <div class="inventory-intro">
        <div>
          <p class="eyebrow">MANUAL / IMPORT FALLBACK</p>
          <h2>建立可复算的账号库存</h2>
        </div>
        <p>百分比属性请带 <code>%</code>，例如 <code>crit_rate=20%</code>；固定数值写作 <code>atk_flat=235</code>。当前公共名称主要来自国际服目录，未确认的国服名称不要强行映射。</p>
      </div>

      <p class="editor-message" id="editor-message" role="status"></p>

      <section class="editor-section" aria-labelledby="hero-editor-title">
        <div class="editor-heading"><div><span>01</span><h2 id="hero-editor-title">拥有角色</h2></div><strong id="hero-count">0</strong></div>
        <form class="editor-form hero-form" id="hero-form">
          <label class="field"><span>角色定义</span><select id="hero-definition" required></select></label>
          <label class="field"><span>等级</span><input id="hero-level" type="number" min="1" value="1" required></label>
          <label class="field"><span>星级</span><input id="hero-stars" type="number" min="1" value="1"></label>
          <label class="field"><span>灵感</span><input id="hero-inspiration" type="number" min="0" value="0"></label>
          <label class="field stats-field"><span>无装备基础属性（等级＞1 必填）</span><textarea id="hero-base-stats" rows="3" placeholder="hp_flat=60000, atk_flat=1500, def_flat=800, crit_rate=10%, crit_damage=50%"></textarea></label>
          <button class="button button-primary form-submit" type="submit">添加角色</button>
        </form>
        <div class="inventory-list" id="hero-list"></div>
      </section>

      <section class="editor-section" aria-labelledby="gear-editor-title">
        <div class="editor-heading"><div><span>02</span><h2 id="gear-editor-title">拥有装备</h2></div><strong id="gear-count">0</strong></div>
        <form class="editor-form gear-form" id="gear-form">
          <label class="field"><span>公共装备定义（可选）</span><select id="gear-definition"><option value="">手工选择槽位与套装</option></select></label>
          <label class="field"><span>槽位</span><select id="gear-slot" required></select></label>
          <label class="field"><span>套装</span><select id="gear-set"></select></label>
          <label class="field"><span>强化等级</span><input id="gear-level" type="number" min="0" value="0" required></label>
          <label class="field checkbox-field"><input id="gear-locked" type="checkbox"><span>账号锁定标记</span></label>
          <label class="field stats-field"><span>属性（逗号或换行分隔）</span><textarea id="gear-stats" rows="3" placeholder="atk_flat=235, crit_rate=12%, crit_damage=27%" required></textarea></label>
          <button class="button button-primary form-submit" type="submit">添加装备</button>
        </form>
        <div class="inventory-list" id="gear-list"></div>
      </section>

      <section class="editor-section" aria-labelledby="artifact-editor-title">
        <div class="editor-heading"><div><span>03</span><h2 id="artifact-editor-title">拥有神器</h2></div><strong id="artifact-count">0</strong></div>
        <form class="editor-form artifact-form" id="artifact-form">
          <label class="field"><span>神器定义</span><select id="artifact-definition" required></select></label>
          <label class="field"><span>强化等级</span><input id="artifact-level" type="number" min="0" max="20" value="20" required></label>
          <label class="field"><span>精炼阶数</span><input id="artifact-refinement" type="number" min="0" max="5" value="0" required></label>
          <label class="field checkbox-field"><input id="artifact-locked" type="checkbox"><span>锁定</span></label>
          <label class="field stats-field"><span>观测面板属性（可选覆盖）</span><textarea id="artifact-stats" rows="3" placeholder="留空则按公共强化曲线；或填 atk_flat=150, crit_rate=20%"></textarea></label>
          <button class="button button-primary form-submit" type="submit">添加神器</button>
        </form>
        <div class="inventory-list" id="artifact-list"></div>
      </section>
    </section>
  </main>

  <script src="inventory.js" type="module"></script>
</body>
</html>
